name: 'foundation_flow'
version: '1.0.0'
config-version: 2

profile: 'foundation_flow'
model-paths: ["models"]
analysis-paths: ["analysis"]
test-paths: ["tests"]
data-paths: ["data"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]
target-path: "target"
clean-targets:
  - "target"
  - "dbt_modules"
  - "logs"

models:
  foundation_flow:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: table
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts

vars:
  # Data transformation parameters
  start_date: '2020-01-01'
  default_ticker: 'AAPL'
  lookback_days: 252  # 1 trading year
  ma_short: 20        # Short-term moving average
  ma_medium: 50       # Medium-term moving average
  ma_long: 200        # Long-term moving average
  volatility_periods:
    - 20
    - 60
    - 252
