services:
  postgres:
    image: postgres:15-alpine
    container_name: foundation_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init_postgres.sql:/docker-entrypoint-initdb.d/01-init.sql
    ports:
      - "${POSTGRES_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - foundation


  timescale:
    image: timescale/timescaledb:latest-pg15-oss
    container_name: foundation_timescale
    environment:
      POSTGRES_USER: ${TIMESCALE_USER}
      POSTGRES_PASSWORD: ${TIMESCALE_PASSWORD}
      POSTGRES_DB: ${TIMESCALE_DB}
    volumes:
      - timescale_data:/var/lib/postgresql/data
      - ./scripts/init_timescale.sql:/docker-entrypoint-initdb.d/01-init.sql
    ports:
      - "${TIMESCALE_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TIMESCALE_USER} -d ${TIMESCALE_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - foundation


  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: foundation_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "127.0.0.1:${PGADMIN_PORT}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
      timescale:
        condition: service_healthy
    networks:
      - foundation
    restart: unless-stopped


  airflow-scheduler:
    build:
      context: .
      dockerfile: docker/Dockerfile.airflow
    container_name: foundation_airflow_scheduler
    environment:
      AIRFLOW__CORE__MIN_SERIALIZATION_INTERVAL: ${AIRFLOW__CORE__MIN_SERIALIZATION_INTERVAL}
      AIRFLOW__DAG_PROCESSOR__REFRESH_INTERVAL: ${AIRFLOW__DAG_PROCESSOR__REFRESH_INTERVAL}
      AIRFLOW__CORE__LOAD_DEFAULT_CONNECTIONS: ${AIRFLOW__CORE__LOAD_DEFAULT_CONNECTIONS}
      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: ${AIRFLOW__CORE__EXECUTION_API_SERVER_URL}
      AIRFLOW__CORE__STORE_SERIALIZED_DAGS: ${AIRFLOW__CORE__STORE_SERIALIZED_DAGS}
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: ${AIRFLOW__DATABASE__SQL_ALCHEMY_CONN}
      AIRFLOW__CORE__TEST_CONNECTION: ${AIRFLOW__CORE__TEST_CONNECTION}
      AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW__API_AUTH__JWT_SECRET}
      AIRFLOW__CORE__LOAD_EXAMPLES: ${AIRFLOW__CORE__LOAD_EXAMPLES}
      AIRFLOW__CORE__AUTH_MANAGER: ${AIRFLOW__CORE__AUTH_MANAGER}
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW__CORE__FERNET_KEY}
      AIRFLOW__CORE__EXECUTOR: ${AIRFLOW__CORE__EXECUTOR}
      AIRFLOW_HOME: ${AIRFLOW_HOME}
      AIRFLOW_UID: ${AIRFLOW_UID}
      AIRFLOW_GID: ${AIRFLOW_GID}
      PYTHONPATH: /opt/airflow
      LOG_LEVEL: ${LOG_LEVEL}
    volumes:
      - ../airflow/operators:/opt/airflow/operators
      - ../airflow/plugins:/opt/airflow/plugins
      - ../airflow/dags:/opt/airflow/dags
      - airflow_logs:/opt/airflow/logs
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - foundation
    command: ["bash", "-c", "airflow db migrate && airflow scheduler"]
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --hostname \"$${HOSTNAME}\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s


  airflow-dag-processor:
    build:
      context: .
      dockerfile: docker/Dockerfile.airflow
    container_name: foundation_airflow_dag_processor
    environment:
      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: ${AIRFLOW__CORE__EXECUTION_API_SERVER_URL}
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: ${AIRFLOW__DATABASE__SQL_ALCHEMY_CONN}
      AIRFLOW__CORE__TEST_CONNECTION: ${AIRFLOW__CORE__TEST_CONNECTION}
      AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW__API_AUTH__JWT_SECRET}
      AIRFLOW__CORE__LOAD_EXAMPLES: ${AIRFLOW__CORE__LOAD_EXAMPLES}
      AIRFLOW__CORE__AUTH_MANAGER: ${AIRFLOW__CORE__AUTH_MANAGER}
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW__CORE__FERNET_KEY}
      AIRFLOW__CORE__EXECUTOR: ${AIRFLOW__CORE__EXECUTOR}
      AIRFLOW_HOME: /opt/airflow
      PYTHONPATH: /opt/airflow
    volumes:
      - ../airflow/operators:/opt/airflow/operators
      - ../airflow/plugins:/opt/airflow/plugins
      - ../airflow/dags:/opt/airflow/dags
      - airflow_logs:/opt/airflow/logs
    depends_on:
      postgres:
        condition: service_healthy
      airflow-scheduler:
        condition: service_healthy
    networks:
      - foundation
    command: ["airflow", "dag-processor"]
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type DagProcessorJob --hostname \"$${HOSTNAME}\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s


  airflow-webserver:
    build:
      context: .
      dockerfile: docker/Dockerfile.airflow
    container_name: foundation_airflow_webserver
    environment:
      AIRFLOW__CORE__MIN_SERIALIZATION_INTERVAL: ${AIRFLOW__CORE__MIN_SERIALIZATION_INTERVAL}
      AIRFLOW__DAG_PROCESSOR__REFRESH_INTERVAL: ${AIRFLOW__DAG_PROCESSOR__REFRESH_INTERVAL}
      AIRFLOW__CORE__LOAD_DEFAULT_CONNECTIONS: ${AIRFLOW__CORE__LOAD_DEFAULT_CONNECTIONS}
      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: ${AIRFLOW__CORE__EXECUTION_API_SERVER_URL}
      AIRFLOW__CORE__STORE_SERIALIZED_DAGS: ${AIRFLOW__CORE__STORE_SERIALIZED_DAGS}
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: ${AIRFLOW__DATABASE__SQL_ALCHEMY_CONN}
      AIRFLOW__CORE__TEST_CONNECTION: ${AIRFLOW__CORE__TEST_CONNECTION}
      AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW__API_AUTH__JWT_SECRET}
      AIRFLOW__CORE__LOAD_EXAMPLES: ${AIRFLOW__CORE__LOAD_EXAMPLES}
      AIRFLOW__CORE__AUTH_MANAGER: ${AIRFLOW__CORE__AUTH_MANAGER}
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW__CORE__FERNET_KEY}
      AIRFLOW__CORE__EXECUTOR: ${AIRFLOW__CORE__EXECUTOR}
      AIRFLOW_HOME: ${AIRFLOW_HOME}
      AIRFLOW_UID: ${AIRFLOW_UID}
      AIRFLOW_GID: ${AIRFLOW_GID}
      PYTHONPATH: /opt/airflow
      LOG_LEVEL: ${LOG_LEVEL}
    volumes:
      - ../airflow/operators:/opt/airflow/operators
      - ../airflow/plugins:/opt/airflow/plugins
      - ../airflow/dags:/opt/airflow/dags
      - airflow_logs:/opt/airflow/logs
    depends_on:
      postgres:
        condition: service_healthy
      airflow-scheduler:
        condition: service_healthy
      airflow-dag-processor:
        condition: service_healthy
    networks:
      - foundation
    ports:
      - "${AIRFLOW_WEBSERVER_PORT}:8080"
    command: ["bash", "-c", "airflow db migrate && airflow api-server"]
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8080/api/v2/monitor/health', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s


  dbt:
    build:
      context: .
      dockerfile: docker/Dockerfile.dbt
    container_name: foundation_dbt
    working_dir: /usr/app/dbt
    environment:
      DBT_POSTGRES_HOST: ${DBT_POSTGRES_HOST}
      DBT_POSTGRES_PORT: "5432"
      DBT_POSTGRES_DB: ${POSTGRES_DB}
      DBT_POSTGRES_USER: ${POSTGRES_USER}
      DBT_POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DBT_TIMESCALE_HOST: ${DBT_TIMESCALE_HOST}
      DBT_TIMESCALE_PORT: "5432"
      DBT_TIMESCALE_DB: ${TIMESCALE_DB}
      DBT_TIMESCALE_USER: ${TIMESCALE_USER}
      DBT_TIMESCALE_PASSWORD: ${TIMESCALE_PASSWORD}
    volumes:
      - ../dbt:/usr/app/dbt
      - ./dbt/profiles.yml:/root/.dbt/profiles.yml:ro
    depends_on:
      postgres:
        condition: service_healthy
      timescale:
        condition: service_healthy
    networks:
      - foundation
    profiles:
      - tools


volumes:
  postgres_data:
  timescale_data:
  airflow_logs:
  pgadmin_data:

networks:
  foundation:
    driver: bridge